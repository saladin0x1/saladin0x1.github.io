<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, follow">
  <title>404 — The Address Ends Here | saladin.su</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/space-mono-latin-400.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face {
      font-family: 'Space Mono';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('/fonts/space-mono-latin-400.woff2') format('woff2');
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      color: #d8d8d8;
      font-family: 'Space Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: url('/noise.png') repeat;
      opacity: 0.035;
    }

    .horizon {
      position: fixed;
      left: 0;
      right: 0;
      top: 68%;
      border-top: 1px solid rgba(255,255,255,.08);
    }

    .code {
      position: fixed;
      right: clamp(24px, 7vw, 110px);
      bottom: 5vh;
      color: rgba(255,255,255,.035);
      font-size: clamp(120px, 28vw, 420px);
      line-height: .8;
      letter-spacing: -.12em;
      user-select: none;
    }

    main {
      position: fixed;
      z-index: 1;
      left: clamp(28px, 9vw, 136px);
      top: 47%;
      width: min(620px, calc(100% - 56px));
      transform: translateY(-50%);
    }

    .eyebrow {
      margin: 0 0 22px;
      color: #666;
      font-size: 11px;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 16ch;
      margin: 0;
      color: #e2e2e2;
      font-size: clamp(30px, 4.4vw, 64px);
      font-weight: 400;
      line-height: 1.12;
      letter-spacing: -.035em;
      text-wrap: balance;
    }

    .note {
      margin: 24px 0 0;
      color: #777;
      font-size: 13px;
    }

    a {
      display: inline-block;
      margin-top: 48px;
      color: #aaa;
      font-size: 12px;
      text-decoration-color: #444;
      text-underline-offset: 6px;
      transition: color .2s ease, text-decoration-color .2s ease;
    }

    a:hover,
    a:focus-visible {
      color: #fff;
      text-decoration-color: #aaa;
      outline: none;
    }

    @media (max-width: 600px) {
      .horizon { top: 75%; }
      .code { right: 16px; bottom: 4vh; }
      .note { max-width: 30ch; line-height: 1.7; }
      a { margin-top: 38px; }
    }
  </style>
</head>
<body>
  <div class="horizon" aria-hidden="true"></div>
  <div class="code" aria-hidden="true">404</div>
  <main>
    <p class="eyebrow">404 · route absent</p>
    <h1>The address ends here.</h1>
    <p class="note">Nothing was waiting beyond it.</p>
    <a href="/">Return to saladin.su</a>
  </main>

  <!-- End Cloudflare Web Analytics -->
</body>
</html>
